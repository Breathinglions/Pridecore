name: Build Pride Flashpoint Fabric JAR
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Gradle 8.12.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12.1'
      - name: Property tests (1000 seeds)
        run: bash tools/test-layout.sh
      - name: Compile and remap Fabric mod
        run: gradle --no-daemon clean build
      - name: Check JAR entrypoint
        run: |
          test -s build/libs/pride-flashpoint-procedural-0.1.0.jar
          jar tf build/libs/pride-flashpoint-procedural-0.1.0.jar | grep -Fx 'fabric.mod.json'
          jar tf build/libs/pride-flashpoint-procedural-0.1.0.jar | grep -Fx 'com/prideregion/flashpoints/PrideFlashpointMod.class'
      - name: Upload installable Fabric mod
        uses: actions/upload-artifact@v4
        with:
          name: PrideFlashpoint-Fabric-1.21.1-JAR
          path: build/libs/pride-flashpoint-procedural-0.1.0.jar
          if-no-files-found: error
