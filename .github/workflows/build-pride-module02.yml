name: Build Pride Core Module 02 Story and NPCs
on:
  push:
    branches: [feature/pridecore-module02-story-npcs]
    paths: ['modules/core/**', '.github/workflows/build-pride-module02.yml']
  pull_request:
    paths: ['modules/core/**', '.github/workflows/build-pride-module02.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.12.1' }
      - name: Module 01 foundation regression tests
        run: bash modules/core/qa/test-core.sh
      - name: Module 02 story engine regression tests
        run: bash modules/core/qa/test-story.sh
      - name: Compile, test config upgrades and remap Fabric mod
        working-directory: modules/core
        run: gradle --no-daemon clean build
      - name: Build and validate native Cobblemon NPC story overlay
        run: |
          python3 modules/core/campaign/build_native_overlay.py \\
            --campaign modules/core/campaign/acts.json \\
            --out modules/core/build/PrideStoryNative_0.3.0-rc1.zip
      - name: Verify installable JAR and story assets
        run: |
          test -s modules/core/build/libs/pride-core-0.3.0-rc1.jar
          jar tf modules/core/build/libs/pride-core-0.3.0-rc1.jar | grep -Fx 'fabric.mod.json'
          jar tf modules/core/build/libs/pride-core-0.3.0-rc1.jar | grep -Fx 'com/prideregion/core/story/StoryModule.class'
          jar tf modules/core/build/libs/pride-core-0.3.0-rc1.jar | grep -Fx 'story/default.json'
          jar tf modules/core/build/libs/pride-core-0.3.0-rc1.jar | grep -Fx 'com/prideregion/core/story/NativeNpcIdentity.class'
      - uses: actions/upload-artifact@v4
        with:
          name: PrideCore-Module02-0.3.0-rc1-Fabric-1.21.1
          path: |
            modules/core/build/libs/pride-core-0.3.0-rc1.jar
            modules/core/build/PrideStoryNative_0.3.0-rc1.zip
            modules/core/campaign/build_native_overlay.py
            modules/core/campaign/acts.json
          if-no-files-found: error
