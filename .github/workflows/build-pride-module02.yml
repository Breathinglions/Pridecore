name: Build Pride Core Module 02 Story and NPCs
on:
  push:
    branches: [feature/pridecore-module02-story-npcs, feature/pridecore-module02-private-rin-scenes]
    paths: ['modules/core/**', '.github/workflows/build-pride-module02.yml']
  pull_request:
    paths: ['modules/core/**', '.github/workflows/build-pride-module02.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.12.1' }
      - name: Module 01 foundation regression tests
        run: bash modules/core/qa/test-core.sh
      - name: Module 02 story engine regression tests
        run: bash modules/core/qa/test-story.sh
      - name: Module 02 FTB chapter and localization regression tests
        run: python3 modules/core/qa/test_ftb_story_overlay.py
      - name: Validate original RCT League balance override safety
        run: python3 modules/core/qa/test_league_balance_overlay.py
      - name: Validate native Cobblemon text-only override generator
        run: python3 modules/core/qa/test_native_dialogue_text_overlay.py
      - name: Check configurable native Theo/Avery reward migration
        run: python3 modules/core/qa/test_configurable_onboarding.py
      - name: Verify unified Hearthleaf native dialogue safety
        run: python3 modules/core/qa/test_unified_onboarding_dialogue.py
      - name: Verify one Rin three private badge-gated native chapters
        run: python3 modules/core/qa/test_rin_native_gated_dialogue.py
      - name: Verify native Cobblemon NPC overlay is not replaced by vanilla chat
        run: python3 modules/core/qa/test_story_npc_interaction.py
      - name: Verify optional private-scene wire contract
        run: python3 modules/core/qa/test_private_scene_wire.py
      - name: Validate authored Module 02 encounter rosters
        run: python3 modules/core/qa/test_story_battle_rosters.py
      - name: Compile, test config upgrades and remap Fabric mod
        working-directory: modules/core
        run: gradle --no-daemon clean build
      - name: Build and validate native Cobblemon NPC story overlay
        run: python3 modules/core/campaign/build_native_overlay.py --campaign modules/core/campaign/acts.json --out modules/core/build/PrideStoryNative_0.3.5-rc1.zip
      - name: Generate additive FTB Quests Per Player narrative chapters
        run: |
          python3 modules/core/campaign/build_ftb_story_chapters.py --out modules/core/build/ftb_story_quest_overlay
          cd modules/core/build
          zip -qr PrideStoryFTB_0.3.5-rc1.zip ftb_story_quest_overlay
          test -s PrideStoryFTB_0.3.5-rc1.zip
      - name: Verify installable JAR and story assets
        run: |
          test -s modules/core/build/libs/pride-core-0.4.3-rc1.jar
          jar tf modules/core/build/libs/pride-core-0.4.3-rc1.jar | grep -Fx 'fabric.mod.json'
          jar tf modules/core/build/libs/pride-core-0.4.3-rc1.jar | grep -Fx 'com/prideregion/core/story/StoryModule.class'
          jar tf modules/core/build/libs/pride-core-0.4.3-rc1.jar | grep -Fx 'story/default.json'
          jar tf modules/core/build/libs/pride-core-0.4.3-rc1.jar | grep -Fx 'com/prideregion/core/story/NativeNpcIdentity.class'
      - uses: actions/upload-artifact@v4
        with:
          name: PrideCore-Module02-0.4.3-rc1-Fabric-1.21.1
          path: |
            modules/core/build/libs/pride-core-0.4.3-rc1.jar
            modules/core/build/PrideStoryNative_0.3.5-rc1.zip
            modules/core/campaign/build_native_overlay.py
            modules/core/campaign/build_unified_module02_dialogue_v043.py
            modules/core/campaign/build_native_dialogue_text_overlay.py
            modules/core/campaign/build_league_balance_overlay.py
            modules/core/campaign/config_examples/onboarding_rewards.example.json
            modules/core/campaign/acts.json
            modules/core/build/PrideStoryFTB_0.3.5-rc1.zip
            modules/core/campaign/build_ftb_story_chapters.py
          if-no-files-found: error
