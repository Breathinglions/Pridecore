name: Build Pride Community (Fabric 1.21.1)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'modules/community/**'
      - '.github/workflows/build-pride-community.yml'
permissions:
  contents: read
jobs:
  community:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12.1'
      - name: Core quiz tests
        working-directory: modules/community
        run: bash qa/run_core_tests.sh
      - name: Reward-coordinator tests
        working-directory: modules/community
        run: bash qa/run_reward_tests.sh
      - name: Persistent leaderboard tests
        working-directory: modules/community
        run: bash qa/run_leaderboard_tests.sh
      - name: Compile Fabric mod against Impactor 5.3.5 and LuckPerms API
        working-directory: modules/community
        run: gradle --no-daemon clean build
      - name: Validate Fabric JAR
        working-directory: modules/community
        run: |
          test -s build/libs/pride-community-0.3.0-dev.jar
          jar tf build/libs/pride-community-0.3.0-dev.jar | grep -Fx 'fabric.mod.json'
          jar tf build/libs/pride-community-0.3.0-dev.jar | grep -Fx 'com/prideregion/community/PrideCommunityMod.class'
      - name: Upload development JAR for review
        uses: actions/upload-artifact@v4
        with:
          name: PrideCommunity-0.3.0-dev-Fabric-1.21.1
          path: modules/community/build/libs/pride-community-0.3.0-dev.jar
          if-no-files-found: error
