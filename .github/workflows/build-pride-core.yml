name: Build Pride Core Foundation
on:
  push:
    branches: [feature/pridecore-progression-foundation]
    paths: ['modules/core/**', '.github/workflows/build-pride-core.yml']
  pull_request:
    paths: ['modules/core/**', '.github/workflows/build-pride-core.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12.1'
      - name: Profile store regression tests
        run: bash modules/core/qa/test-core.sh
      - name: Compile and remap Fabric JAR
        working-directory: modules/core
        run: gradle --no-daemon clean build
      - name: Verify installable JAR
        run: |
          version="$(sed -n 's/^mod_version=//p' modules/core/gradle.properties)"
          test -n "$version"
          jar_file="modules/core/build/libs/pride-core-$version.jar"
          test -s "$jar_file"
          jar tf "$jar_file" | grep -Fx 'fabric.mod.json'
          jar tf "$jar_file" | grep -Fx 'com/prideregion/core/PrideCoreMod.class'
          jar tf "$jar_file" | grep -Fx 'com/prideregion/core/ProgressionService.class'
          echo "CORE_JAR=$jar_file" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: PrideCore-Foundation-Regression-Fabric-1.21.1
          path: ${{ env.CORE_JAR }}
          if-no-files-found: error
