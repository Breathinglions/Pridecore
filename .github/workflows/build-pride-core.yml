name: Build Pride Core Foundation
on:
  push:
    branches: [feature/pridecore-progression-foundation]
    paths: ['modules/core/**', '.github/workflows/build-pride-core.yml']
  pull_request:
    paths: ['modules/core/**', '.github/workflows/build-pride-core.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12.1'
      - name: Profile store regression tests
        run: bash modules/core/qa/test-core.sh
      - name: Compile and remap Fabric JAR
        working-directory: modules/core
        run: gradle --no-daemon clean build
      - name: Verify installable JAR
        run: |
          test -s modules/core/build/libs/pride-core-0.1.0-rc1.jar
          jar tf modules/core/build/libs/pride-core-0.1.0-rc1.jar | grep -Fx 'fabric.mod.json'
          jar tf modules/core/build/libs/pride-core-0.1.0-rc1.jar | grep -Fx 'com/prideregion/core/PrideCoreMod.class'
          jar tf modules/core/build/libs/pride-core-0.1.0-rc1.jar | grep -Fx 'com/prideregion/core/ProgressionService.class'
      - uses: actions/upload-artifact@v4
        with:
          name: PrideCore-Module01-0.1.0-rc1-Fabric-1.21.1
          path: modules/core/build/libs/pride-core-0.1.0-rc1.jar
          if-no-files-found: error
