# COPY TO config/pride_core/rin_scene_anchors.properties in an ISOLATED STAGING SERVER.
# Keep disabled until every configured anchor is an exact builder-verified coordinate.
# NO player-facing scenes are modified by this file.
visual_preview_enabled=false

# Replace the illustrative values with the real staged world registry id
# and the real build anchor positions before changing enabled to true.
# Entry, move and face points must be in the same dimension.
# face may be a compass direction: north, south, east or west.
# exit is optional, defaulting to entry; it is used for a visible walk-out.
# Example tested laboratory in multiworld:prideregiontest:
# scene.lab.dimension=multiworld:prideregiontest
# scene.lab.entry=-53,102,3197
# scene.lab.move=-57,102,3197
# scene.lab.face=north
# scene.lab.exit=-51,102,3197
# Note: -57 to -51 increases X, so the actual exit path travels EAST,
# even though the initial entry walks WEST (-53 to -57).
# scene.lab.dimension=pride:staging
# scene.lab.entry=<x>,<y>,<z>
# scene.lab.move=<x>,<y>,<z>
# scene.lab.face=north
# scene.lab.exit=<x>,<y>,<z>

# scene.canyon.dimension=pride:staging
# scene.canyon.entry=<x>,<y>,<z>
# scene.canyon.move=<x>,<y>,<z>
# scene.canyon.face=<x>,<y>,<z>

# scene.summit.dimension=pride:staging
# scene.summit.entry=<x>,<y>,<z>
# scene.summit.move=<x>,<y>,<z>
# scene.summit.face=<x>,<y>,<z>
